<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Hub</title>

<style>
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  color:white;
  background:#05070f;
}

/* 🌌 NEON BACKGROUND */
.bg{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at 20% 20%, #00ffcc22, transparent 40%),
             radial-gradient(circle at 80% 60%, #7a00ff22, transparent 40%),
             radial-gradient(circle at 40% 80%, #00aaff22, transparent 40%);
  animation:move 10s infinite alternate ease-in-out;
  z-index:-1;
}

@keyframes move{
  0%{transform:scale(1) translate(0,0);}
  100%{transform:scale(1.2) translate(-20px,20px);}
}

/* HEADER */
header{
  text-align:center;
  padding:25px;
}

header h1{
  font-size:42px;
  margin:0;
  text-shadow:0 0 15px #00ffcc;
}

/* HUB */
.hub{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  padding:30px;
}

/* 🎮 STEAM CARD */
.card{
  width:230px;
  height:210px;
  border-radius:16px;
  position:relative;
  background-size:cover;
  background-position:center;
  cursor:pointer;
  overflow:hidden;
  transition:0.25s;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:12px;

  border:2px solid rgba(0,255,200,0.6);
  box-shadow:0 0 20px rgba(0,255,200,0.2);
}

.card:hover{
  transform:scale(1.08);
  box-shadow:0 0 30px rgba(0,255,200,0.8);
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.5);
}

.card h2{
  position:relative;
  margin:0;
  z-index:2;
}

.stats{
  position:relative;
  z-index:2;
  font-size:12px;
  color:#aefcff;
}

/* LOADING */
#loading{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:black;
  z-index:999;
}

/* GAME SCREEN */
#gameScreen{
  position:fixed;
  inset:0;
  display:none;
  flex-direction:column;
  background:black;
}

#topbar{
  background:#111;
  padding:10px;
  display:flex;
  justify-content:space-between;
}

/* MUSIC BTN */
#musicBtn{
  position:fixed;
  bottom:15px;
  right:15px;
  padding:10px;
  border:none;
  background:#00ffcc;
  font-weight:bold;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="bg"></div>

<header>
  <h1>🎮 STEAM HUB</h1>
  <p>Neon Game Launcher</p>
</header>

<div class="hub">

  <div class="card" style="background-image:url(logochess.png)"
    onclick="openGame('game1.html','chess')">
    <div class="overlay"></div>
    <h2>♟ Chess</h2>
    <div class="stats" id="chessStats"></div>
  </div>

  <div class="card" style="background-image:url(logocheckers.png)"
    onclick="openGame('game2.html','checkers')">
    <div class="overlay"></div>
    <h2>⚫ Checkers</h2>
    <div class="stats" id="checkersStats"></div>
  </div>

  <div class="card" style="background-image:url(logocrosssum.png)"
    onclick="openGame('game3.html','cross')">
    <div class="overlay"></div>
    <h2>🧠 Cross Sums</h2>
    <div class="stats" id="crossStats"></div>
  </div>

</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="elevator.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" onclick="toggleMusic()">🎵 Music</button>

<!-- LOADING -->
<div id="loading">Loading...</div>

<!-- GAME -->
<div id="gameScreen">
  <div id="topbar">
    <span id="title"></span>
    <button onclick="closeGame()">⬅ Back</button>
  </div>
  <iframe id="frame"></iframe>
</div>

<script>

/* 🎧 MUSIC SAFE START */
let music = document.getElementById("music");
let started = false;

function startMusic(){
  if(started) return;
  music.play().then(()=>started=true).catch(()=>{});
}
document.addEventListener("click", startMusic);

/* 📊 LOCAL SAVE SYSTEM (GitHub-ready structure) */
let stats = JSON.parse(localStorage.getItem("stats")) || {
  chess:{time:0},
  checkers:{time:0},
  cross:{time:0}
};

let timer=null;
let active=null;

/* UI */
function update(){
  document.getElementById("chessStats").innerText="⏱ "+stats.chess.time+"s";
  document.getElementById("checkersStats").innerText="⏱ "+stats.checkers.time+"s";
  document.getElementById("crossStats").innerText="⏱ "+stats.cross.time+"s";
  localStorage.setItem("stats",JSON.stringify(stats));
}

/* OPEN GAME */
function openGame(file,key){

  active=key;
  document.getElementById("loading").style.display="flex";

  setTimeout(()=>{
    document.getElementById("loading").style.display="none";
    document.querySelector(".hub").style.display="none";
    document.querySelector("header").style.display="none";

    document.getElementById("gameScreen").style.display="flex";
    document.getElementById("frame").src=file;

    timer=setInterval(()=>{
      stats[key].time++;
      update();
    },1000);

  },800);
}

/* CLOSE */
function closeGame(){
  clearInterval(timer);
  document.getElementById("gameScreen").style.display="none";
  document.querySelector(".hub").style.display="flex";
  document.querySelector("header").style.display="block";
  document.getElementById("frame").src="";
}

/* MUSIC */
function toggleMusic(){
  music.paused ? music.play() : music.pause();
}

update();

</script>

</body>
</html>
