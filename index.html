<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎮 Game Hub</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  background:#0b0f1a;
  overflow:hidden;
}

/* HEADER */
header{
  text-align:center;
  padding:20px;
}

/* 🎮 CUSTOM STEAM-LIKE LAYOUT */
.hub{
  display:grid;

  /* custom layout like you want */
  grid-template-columns:220px 220px 220px;
  grid-template-areas:
    "g1 g2 g3"
    "g4 .  . "
    "g5 .  . ";

  gap:20px;
  justify-content:center;
  padding:40px;
}

/* assign positions */
#game1{grid-area:g1;}
#game2{grid-area:g2;}
#game3{grid-area:g3;}
#game4{grid-area:g4;}

/* optional 5th slot if you add later */
#game5{grid-area:g5;}

/* 🎮 CARD */
.card{
  width:220px;
  height:200px;
  border-radius:16px;
  position:relative;
  background-size:cover;
  background-position:center;
  cursor:pointer;
  overflow:hidden;
  transition:0.15s;

  border:2px solid rgba(0,255,255,0.4);
  box-shadow:0 0 12px rgba(0,255,255,0.2);
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 22px rgba(0,255,255,0.7);
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
}

.card h2{
  position:absolute;
  bottom:10px;
  left:10px;
  margin:0;
  font-size:16px;
}

.stats{
  position:absolute;
  bottom:30px;
  left:10px;
  font-size:12px;
  color:#9ffcff;
}

/* 🎮 GAME SCREEN */
#gameScreen{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  flex-direction:column;
}

#topbar{
  background:#111;
  padding:10px;
  display:flex;
  justify-content:space-between;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#00ffcc;
  font-weight:bold;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* ⏳ LOADING (STATIC — NO ANIMATION FIXED) */
#loading{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.loader{
  width:70px;
  height:70px;
  border:6px solid #222;
  border-top:6px solid #00ffcc;
  border-radius:50%;
}

#loadingText{
  margin-top:12px;
  color:#00ffcc;
}
</style>
</head>

<body>

<header>
  <h1>🎮 GAME HUB</h1>
  <p>Choose your game</p>
</header>

<div class="hub">

  <div class="card" id="game1"
    style="background-image:url(logochess.png)"
    onclick="openGame('game1.html','Chess','chess')">
    <div class="overlay"></div>
    <h2>♟ Chess</h2>
    <div class="stats" id="chessStats"></div>
  </div>

  <div class="card" id="game2"
    style="background-image:url(logocheckers.png)"
    onclick="openGame('game2.html','Checkers','checkers')">
    <div class="overlay"></div>
    <h2>⚫ Checkers</h2>
    <div class="stats" id="checkersStats"></div>
  </div>

  <div class="card" id="game3"
    style="background-image:url(logocrosssum.png)"
    onclick="openGame('game3.html','Cross Sums','cross')">
    <div class="overlay"></div>
    <h2>🧠 Cross Sums</h2>
    <div class="stats" id="crossStats"></div>
  </div>

  <div class="card" id="game4"
    style="background-image:url(fruit.png)"
    onclick="openGame('fruit.html','Fruit Clicker','fruit')">
    <div class="overlay"></div>
    <h2>🍓 Fruit Clicker</h2>
    <div class="stats" id="fruitStats"></div>
  </div>

</div>

<!-- LOADING -->
<div id="loading">
  <div class="loader"></div>
  <div id="loadingText">Loading game...</div>
</div>

<!-- GAME -->
<div id="gameScreen">
  <div id="topbar">
    <span id="title">Game</span>
    <button onclick="closeGame()">⬅ Back</button>
  </div>
  <iframe id="frame"></iframe>
</div>

<script>

let stats = JSON.parse(localStorage.getItem("gameStats")) || {
  chess:{time:0},
  checkers:{time:0},
  cross:{time:0},
  fruit:{time:0}
};

let timer=null;

function updateUI(){
  document.getElementById("chessStats").innerText=`⏱ ${stats.chess.time}s`;
  document.getElementById("checkersStats").innerText=`⏱ ${stats.checkers.time}s`;
  document.getElementById("crossStats").innerText=`⏱ ${stats.cross.time}s`;
  document.getElementById("fruitStats").innerText=`⏱ ${stats.fruit.time}s`;
  localStorage.setItem("gameStats",JSON.stringify(stats));
}

function openGame(file,title,key){

  document.getElementById("loading").style.display="flex";

  setTimeout(()=>{

    document.getElementById("loading").style.display="none";

    document.querySelector(".hub").style.display="none";
    document.querySelector("header").style.display="none";

    document.getElementById("gameScreen").style.display="flex";
    document.getElementById("frame").src=file;
    document.getElementById("title").innerText=title;

    timer=setInterval(()=>{
      stats[key].time++;
      updateUI();
    },1000);

  },900);
}

function closeGame(){
  clearInterval(timer);

  document.getElementById("gameScreen").style.display="none";
  document.querySelector(".hub").style.display="grid";
  document.querySelector("header").style.display="block";

  document.getElementById("frame").src="";
  updateUI();
}

updateUI();

</script>

</body>
</html>
