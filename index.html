<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎮 Game Hub</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  background:radial-gradient(circle at top,#0f172a,#0b0f1a);
  overflow:hidden;
}

/* HEADER */
header{
  text-align:center;
  padding:20px;
}

/* HUB LAYOUT */
.hub{
  display:grid;
  grid-template-columns:220px 220px 220px;
  grid-template-areas:
    "g1 g2 g3"
    "g4 g5 . ";
  gap:20px;
  justify-content:center;
  padding:40px;
}

/* CARDS (✨ improved graphics only) */
.card{
  width:220px;
  height:200px;
  border-radius:18px;
  position:relative;
  background-size:cover;
  background-position:center;
  cursor:pointer;
  overflow:hidden;
  transition:0.25s ease;

  border:1px solid rgba(0,255,255,0.25);
  box-shadow:
    0 0 12px rgba(0,255,255,0.15),
    inset 0 0 30px rgba(255,255,255,0.03);
  backdrop-filter: blur(6px);
}

.card:hover{
  transform:scale(1.07);
  box-shadow:
    0 0 25px rgba(0,255,255,0.45),
    0 10px 40px rgba(0,0,0,0.5);
}

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,0.6),transparent);
}

.card h2{
  position:absolute;
  bottom:10px;
  left:10px;
  margin:0;
  font-size:16px;
}

.stats{
  position:absolute;
  bottom:30px;
  left:10px;
  font-size:12px;
  color:#9ffcff;
}

/* GAME SCREEN */
#gameScreen{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  flex-direction:column;
}

#topbar{
  background:#111;
  padding:10px;
  display:flex;
  justify-content:space-between;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#00ffcc;
  font-weight:bold;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* LOADING (🔄 FIXED ROTATION) */
#loading{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.loader{
  width:70px;
  height:70px;
  border:6px solid #222;
  border-top:6px solid #00ffcc;
  border-radius:50%;
  animation:spin 1s linear infinite; /* 🔥 FIX */
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

#loadingText{
  margin-top:12px;
  color:#00ffcc;
}
</style>
</head>

<body>

<header>
  <h1>🎮 GAME HUB</h1>
  <p>Choose your game</p>
</header>

<div class="hub">

  <div class="card" style="background-image:url(logochess.png)"
    onclick="openGame('game1.html','Chess','chess')">
    <div class="overlay"></div>
    <h2>♟ Chess</h2>
    <div class="stats" id="chessStats"></div>
  </div>

  <div class="card" style="background-image:url(logocheckers.png)"
    onclick="openGame('game2.html','Checkers','checkers')">
    <div class="overlay"></div>
    <h2>⚫ Checkers</h2>
    <div class="stats" id="checkersStats"></div>
  </div>

  <div class="card" style="background-image:url(logocrosssum.png)"
    onclick="openGame('game3.html','Cross Sums','cross')">
    <div class="overlay"></div>
    <h2>🧠 Cross Sums</h2>
    <div class="stats" id="crossStats"></div>
  </div>

  <div class="card" style="background-image:url(fruit.png)"
    onclick="openGame('fruit.html','Fruit Clicker','fruit')">
    <div class="overlay"></div>
    <h2>🍓 Fruit Clicker</h2>
    <div class="stats" id="fruitStats"></div>
  </div>

  <div class="card" style="background-image:url(unologo.png)"
    onclick="openGame('uno.html','UNO Deluxe','uno')">
    <div class="overlay"></div>
    <h2>🃏 UNO Deluxe</h2>
    <div class="stats" id="unoStats"></div>
  </div>

</div>

<!-- LOADING -->
<div id="loading">
  <div class="loader"></div>
  <div id="loadingText">Loading game...</div>
</div>

<!-- GAME -->
<div id="gameScreen">
  <div id="topbar">
    <span id="title">Game</span>
    <button onclick="closeGame()">⬅ Back</button>
  </div>
  <iframe id="frame"></iframe>
</div>

<script>

let stats = JSON.parse(localStorage.getItem("gameStats")) || {
  chess:{time:0},
  checkers:{time:0},
  cross:{time:0},
  fruit:{time:0},
  uno:{time:0}
};

let timer=null;
let activeKey=null;

function updateUI(){

  document.getElementById("chessStats").innerText=`⏱ ${stats.chess.time}s`;
  document.getElementById("checkersStats").innerText=`⏱ ${stats.checkers.time}s`;
  document.getElementById("crossStats").innerText=`⏱ ${stats.cross.time}s`;
  document.getElementById("fruitStats").innerText=`⏱ ${stats.fruit.time}s`;
  document.getElementById("unoStats").innerText=`⏱ ${stats.uno.time}s`;

  localStorage.setItem("gameStats",JSON.stringify(stats));
}

function openGame(file,title,key){

  document.getElementById("loading").style.display="flex";

  setTimeout(()=>{

    document.getElementById("loading").style.display="none";

    document.querySelector(".hub").style.display="none";
    document.querySelector("header").style.display="none";

    document.getElementById("gameScreen").style.display="flex";
    document.getElementById("frame").src=file;
    document.getElementById("title").innerText=title;

    activeKey = key; // 🔥 FIX UNO + all games tracking

    timer=setInterval(()=>{
      stats[activeKey].time++;
      updateUI();
    },1000);

  },800);
}

function closeGame(){
  clearInterval(timer);

  document.getElementById("gameScreen").style.display="none";
  document.querySelector(".hub").style.display="grid";
  document.querySelector("header").style.display="block";

  document.getElementById("frame").src="";
  activeKey=null;

  updateUI();
}

updateUI();

</script>

</body>
</html>
