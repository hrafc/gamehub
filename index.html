<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎮 Game Hub</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  overflow:hidden;
  background:#0b0f1a;
}

/* 🌌 NEON BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:-200px;
  background:radial-gradient(circle at 20% 20%, #00ffcc33, transparent 40%),
             radial-gradient(circle at 80% 70%, #ff00ff33, transparent 40%),
             radial-gradient(circle at 50% 50%, #00aaff33, transparent 50%);
  animation:moveBg 12s infinite linear;
  z-index:-1;
}

@keyframes moveBg{
  0%{transform:rotate(0deg) scale(1);}
  100%{transform:rotate(360deg) scale(1.2);}
}

/* HEADER */
header{
  text-align:center;
  padding:20px;
}
header h1{
  margin:0;
  font-size:40px;
}

/* HUB */
.hub{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  padding:30px;
}

/* 🎮 CARD */
.card{
  width:220px;
  height:200px;
  border-radius:16px;
  position:relative;
  background-size:cover;
  background-position:center;
  cursor:pointer;
  overflow:hidden;
  transition:0.25s;
  display:flex;
  align-items:flex-end;
  padding:12px;

  border:2px solid rgba(0,255,255,0.5);
  box-shadow:0 0 15px rgba(0,255,255,0.3);
}

.card:hover{
  transform:scale(1.08);
  box-shadow:0 0 25px rgba(0,255,255,0.9);
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
}

.card h2{
  position:relative;
  margin:0;
  font-size:18px;
  z-index:2;
}

.stats{
  position:relative;
  z-index:2;
  font-size:12px;
  color:#9ffcff;
}

/* 🎮 GAME SCREEN */
#gameScreen{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  flex-direction:column;
}

#topbar{
  background:#111;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#00ffcc;
  font-weight:bold;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* ⏳ LOADING SCREEN */
#loading{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
}

/* 🔵 SPINNER CIRCLE (FIXED) */
.loader{
  width:70px;
  height:70px;
  border:6px solid #222;
  border-top:6px solid #00ffcc;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

#loadingText{
  margin-top:12px;
  color:#00ffcc;
}
</style>
</head>

<body>

<header>
  <h1>🎮 GAME HUB</h1>
  <p>Choose your game</p>
</header>

<div class="hub">

  <div class="card" style="background-image:url(logochess.png)"
    onclick="openGame('game1.html','Chess','chess')">
    <div class="overlay"></div>
    <h2>♟ Chess</h2>
    <div class="stats" id="chessStats"></div>
  </div>

  <div class="card" style="background-image:url(logocheckers.png)"
    onclick="openGame('game2.html','Checkers','checkers')">
    <div class="overlay"></div>
    <h2>⚫ Checkers</h2>
    <div class="stats" id="checkersStats"></div>
  </div>

  <div class="card" style="background-image:url(logocrosssum.png)"
    onclick="openGame('game3.html','Cross Sums','cross')">
    <div class="overlay"></div>
    <h2>🧠 Cross Sums</h2>
    <div class="stats" id="crossStats"></div>
  </div>

  <div class="card" style="background-image:url(fruit.png)"
    onclick="openGame('fruit.html','Fruit Clicker','fruit')">
    <div class="overlay"></div>
    <h2>🍓 Fruit Clicker</h2>
    <div class="stats" id="fruitStats"></div>
  </div>

</div>

<!-- ⏳ LOADING -->
<div id="loading">
  <div class="loader"></div>
  <div id="loadingText">Loading game...</div>
</div>

<!-- 🎮 GAME -->
<div id="gameScreen">
  <div id="topbar">
    <span id="title">Game</span>
    <button onclick="closeGame()">⬅ Back</button>
  </div>
  <iframe id="frame"></iframe>
</div>

<script>

/* 💾 SAVE */
let stats = JSON.parse(localStorage.getItem("gameStats")) || {
  chess:{time:0},
  checkers:{time:0},
  cross:{time:0},
  fruit:{time:0}
};

let activeGame = null;
let timer = null;

/* 📊 UI */
function updateUI(){
  document.getElementById("chessStats").innerText = `⏱ ${stats.chess.time}s`;
  document.getElementById("checkersStats").innerText = `⏱ ${stats.checkers.time}s`;
  document.getElementById("crossStats").innerText = `⏱ ${stats.cross.time}s`;
  document.getElementById("fruitStats").innerText = `⏱ ${stats.fruit.time}s`;

  localStorage.setItem("gameStats", JSON.stringify(stats));
}

/* 🎮 OPEN GAME */
function openGame(file,title,key){

  activeGame = key;

  document.getElementById("loading").style.display="flex";

  setTimeout(()=>{

    document.getElementById("loading").style.display="none";

    document.querySelector(".hub").style.display="none";
    document.querySelector("header").style.display="none";

    document.getElementById("gameScreen").style.display="flex";
    document.getElementById("frame").src=file;
    document.getElementById("title").innerText=title;

    timer = setInterval(()=>{
      stats[key].time++;
      updateUI();
    },1000);

  },1200);
}

/* 🔙 CLOSE */
function closeGame(){
  clearInterval(timer);
  timer=null;

  document.getElementById("gameScreen").style.display="none";
  document.querySelector(".hub").style.display="flex";
  document.querySelector("header").style.display="block";

  document.getElementById("frame").src="";
  activeGame=null;

  updateUI();
}

/* INIT */
updateUI();

</script>

</body>
</html>
