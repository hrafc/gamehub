<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Hub</title>
<meta name="theme-color" content="#00ffcc">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#05070f;
  color:white;
  overflow:hidden;
}

/* 🌌 BACKGROUND */
.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, #00ffcc33, transparent 40%),
    radial-gradient(circle at 80% 60%, #7a00ff33, transparent 40%),
    radial-gradient(circle at 40% 80%, #00aaff33, transparent 40%);
  animation:move 8s infinite alternate ease-in-out;
  z-index:-1;
}

@keyframes move{
  0%{transform:scale(1);}
  100%{transform:scale(1.15) translate(-20px,20px);}
}

/* HEADER */
header{
  text-align:center;
  padding:25px;
}

header h1{
  font-size:42px;
  margin:0;
  text-shadow:0 0 15px #00ffcc;
}

/* HUB */
.hub{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  padding:30px;
}

.card{
  width:230px;
  height:210px;
  border-radius:16px;
  position:relative;
  background-size:cover;
  background-position:center;
  cursor:pointer;
  overflow:hidden;
  transition:0.25s;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:12px;

  border:2px solid rgba(0,255,200,0.6);
  box-shadow:0 0 20px rgba(0,255,200,0.2);
}

.card:hover{
  transform:scale(1.08);
  box-shadow:0 0 30px rgba(0,255,200,0.8);
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.5);
}

.card h2{
  position:relative;
  margin:0;
  z-index:2;
}

/* ⭕ LOADING FIXED */
#loading{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.98);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999999; /* IMPORTANT */
}

.spinner{
  width:80px;
  height:80px;
  border:7px solid #333;
  border-top:7px solid #00ffcc;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

#loadingText{
  margin-top:15px;
  color:#00ffcc;
}

/* GAME */
#gameScreen{
  position:fixed;
  inset:0;
  display:none;
  flex-direction:column;
  background:black;
  z-index:10;
}

#topbar{
  background:#111;
  padding:10px;
  display:flex;
  justify-content:space-between;
}

/* 🎧 MUSIC BUTTON LOCKED STYLE */
#musicBtn{
  position:fixed;
  bottom:15px;
  right:15px;
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#00ffcc;
  font-weight:bold;
  cursor:pointer;
  z-index:1000;
}
</style>
</head>

<body>

<div class="bg"></div>

<header>
  <h1>🎮 GAME HUB</h1>
  <p>Steam-style launcher</p>
</header>

<div class="hub">

  <div class="card" style="background-image:url(logochess.png)"
    onclick="openGame('game1.html','Chess')">
    <div class="overlay"></div>
    <h2>♟ Chess</h2>
  </div>

  <div class="card" style="background-image:url(logocheckers.png)"
    onclick="openGame('game2.html','Checkers')">
    <div class="overlay"></div>
    <h2>⚫ Checkers</h2>
  </div>

  <div class="card" style="background-image:url(logocrosssum.png)"
    onclick="openGame('game3.html','Cross Sums')">
    <div class="overlay"></div>
    <h2>🧠 Cross Sums</h2>
  </div>

</div>

<!-- 🎧 AUDIO (LOCKED CONTROL) -->
<audio id="music" loop preload="auto">
  <source src="elevator.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" onclick="toggleMusic()">🎵 Music</button>

<!-- ⭕ LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <div id="loadingText">Loading game...</div>
</div>

<!-- GAME -->
<div id="gameScreen">
  <div id="topbar">
    <span id="title"></span>
    <button onclick="closeGame()">⬅ Back</button>
  </div>
  <iframe id="frame" style="width:100%;height:100%;border:none;"></iframe>
</div>

<script>

const music = document.getElementById("music");

/* 🔒 HARD LOCK MUSIC STATE */
let musicState = false;

function toggleMusic(){
  musicState = !musicState;

  if(musicState){
    music.play().catch(()=>{musicState=false;});
  }else{
    music.pause();
  }
}

/* prevent weird auto pause behavior */
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) return;
});

/* 🎮 OPEN GAME */
function openGame(file,title){

  document.getElementById("loading").style.display="flex";

  setTimeout(()=>{

    document.getElementById("loading").style.display="none";

    document.querySelector(".hub").style.display="none";
    document.querySelector("header").style.display="none";

    document.getElementById("gameScreen").style.display="flex";
    document.getElementById("frame").src=file;
    document.getElementById("title").innerText=title;

  },1000);
}

/* CLOSE */
function closeGame(){
  document.getElementById("gameScreen").style.display="none";
  document.querySelector(".hub").style.display="flex";
  document.querySelector("header").style.display="block";
  document.getElementById("frame").src="";
}

</script>

</body>
</html>
