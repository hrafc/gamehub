<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎮 GAME HUB</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0b1020;
    color:white;
    overflow:hidden;
}

/* BACKGROUND */

.bg{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,#16345f 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0d5f53 0%,transparent 35%),
    linear-gradient(135deg,#0b1020,#0f172a);
    z-index:-1;
}

/* HEADER */

header{
    text-align:center;
    padding:25px;
}

header h1{
    font-size:55px;
    text-shadow:0 0 20px #00ffe5;
}

header p{
    margin-top:10px;
    opacity:0.8;
}

/* MUSIC BUTTON */

#musicBtn{
    position:fixed;
    top:20px;
    right:20px;
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:#00ffd0;
    color:black;
    font-size:22px;
    cursor:pointer;
    z-index:100;
    box-shadow:0 0 20px rgba(0,255,200,0.7);
}

/* GAMES GRID */

.gamesGrid{
    width:100%;
    height:calc(100vh - 130px);
    overflow-y:auto;

    display:grid;
    grid-template-columns:repeat(3,260px);
    justify-content:center;

    gap:28px;
    padding:20px 40px 120px;
}

/* GAME CARD */

.card{
    width:260px;
    height:200px;

    position:relative;
    overflow:hidden;

    border-radius:22px;

    background-size:cover;
    background-position:center;

    cursor:pointer;

    transition:0.25s;

    border:2px solid rgba(0,255,200,0.4);

    box-shadow:
    0 0 20px rgba(0,255,200,0.2);
}

.card:hover{
    transform:translateY(-8px) scale(1.03);

    box-shadow:
    0 0 35px rgba(0,255,200,0.7);
}

/* OVERLAY */

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
    to top,
    rgba(0,0,0,0.85),
    rgba(0,0,0,0.1)
    );
}

/* BOTTOM */

.cardBottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    padding:15px;

    z-index:2;
}

.cardBottom h2{
    font-size:24px;
    margin-bottom:6px;
}

.stats{
    font-size:14px;
    opacity:0.9;
    color:#99ffee;
}

/* LOADING */

#loading{
    position:fixed;
    inset:0;

    background:black;

    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:999;
}

.loader{
    width:85px;
    height:85px;

    border-radius:50%;

    border:8px solid #222;
    border-top:8px solid #00ffd0;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

#loadingText{
    margin-top:20px;
    font-size:22px;
    color:#00ffd0;
}

/* GAME SCREEN */

#gameScreen{
    position:fixed;
    inset:0;

    background:black;

    display:none;
    flex-direction:column;

    z-index:500;
}

#topbar{
    height:70px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 20px;

    background:#101010;
}

#title{
    font-size:26px;
    font-weight:bold;
}

#backBtn{
    border:none;
    padding:12px 18px;
    border-radius:12px;
    background:#00ffd0;
    font-weight:bold;
    cursor:pointer;
}

iframe{
    flex:1;
    border:none;
    background:black;
}

/* MOBILE */

@media(max-width:900px){

.gamesGrid{
    grid-template-columns:1fr;
    justify-items:center;
}

}

</style>
</head>

<body>

<div class="bg"></div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
    <source src="elevator.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn">🎵</button>

<!-- HEADER -->

<header>
    <h1>🎮 GAME HUB</h1>
    <p>Select your game and chill ✨</p>
</header>

<!-- GAMES -->

<div class="gamesGrid">

    <!-- CHESS -->
    <div class="card"
    style="background-image:url(logochess.png)"
    onclick="openGame('game1.html','Chess','chess')">

        <div class="overlay"></div>

        <div class="cardBottom">
            <h2>♟ Chess</h2>
            <div class="stats" id="chessStats">⏱ 0s</div>
        </div>

    </div>

    <!-- CHECKERS -->
    <div class="card"
    style="background-image:url(logocheckers.png)"
    onclick="openGame('game2.html','Checkers','checkers')">

        <div class="overlay"></div>

        <div class="cardBottom">
            <h2>⚫ Checkers</h2>
            <div class="stats" id="checkersStats">⏱ 0s</div>
        </div>

    </div>

    <!-- CROSS SUM -->
    <div class="card"
    style="background-image:url(logocrosssum.png)"
    onclick="openGame('game3.html','Cross Sums','cross')">

        <div class="overlay"></div>

        <div class="cardBottom">
            <h2>🧠 Cross Sums</h2>
            <div class="stats" id="crossStats">⏱ 0s</div>
        </div>

    </div>

    <!-- FRUIT -->
    <div class="card"
    style="background-image:url(logofruit.png)"
    onclick="openGame('fruitclicker.html','Fruit Clicker','fruit')">

        <div class="overlay"></div>

        <div class="cardBottom">
            <h2>🌸 Fruit Clicker</h2>
            <div class="stats" id="fruitStats">⏱ 0s</div>
        </div>

    </div>

    <!-- UNO -->
    <div class="card"
    style="background-image:url(logouno.png)"
    onclick="openGame('uno.html','UNO Deluxe','uno')">

        <div class="overlay"></div>

        <div class="cardBottom">
            <h2>🃏 UNO Deluxe</h2>
            <div class="stats" id="unoStats">⏱ 0s</div>
        </div>

    </div>

</div>

<!-- LOADING -->

<div id="loading">

    <div class="loader"></div>

    <div id="loadingText">
        Loading...
    </div>

</div>

<!-- GAME SCREEN -->

<div id="gameScreen">

    <div id="topbar">

        <div id="title">
            Game
        </div>

        <button id="backBtn"
        onclick="closeGame()">
        ⬅ Back
        </button>

    </div>

    <iframe id="frame"></iframe>

</div>

<script>

/* MUSIC */

const music =
document.getElementById("bgMusic");

const musicBtn =
document.getElementById("musicBtn");

let playing = false;

musicBtn.onclick = ()=>{

    if(playing){

        music.pause();

        musicBtn.innerHTML = "🔇";

    }else{

        music.play();

        musicBtn.innerHTML = "🎵";
    }

    playing = !playing;
};

/* SAVE SYSTEM */

let stats =
JSON.parse(
localStorage.getItem("gameStats")
)
||
{
    chess:{time:0},
    checkers:{time:0},
    cross:{time:0},
    fruit:{time:0},
    uno:{time:0}
};

let activeGame = null;
let timer = null;

/* UPDATE UI */

function updateUI(){

    document.getElementById(
    "chessStats"
    ).innerText =
    `⏱ ${stats.chess.time}s`;

    document.getElementById(
    "checkersStats"
    ).innerText =
    `⏱ ${stats.checkers.time}s`;

    document.getElementById(
    "crossStats"
    ).innerText =
    `⏱ ${stats.cross.time}s`;

    document.getElementById(
    "fruitStats"
    ).innerText =
    `⏱ ${stats.fruit.time}s`;

    document.getElementById(
    "unoStats"
    ).innerText =
    `⏱ ${stats.uno.time}s`;

    localStorage.setItem(
    "gameStats",
    JSON.stringify(stats)
    );
}

/* OPEN GAME */

function openGame(file,title,key){

    activeGame = key;

    document.getElementById(
    "loading"
    ).style.display = "flex";

    document.getElementById(
    "loadingText"
    ).innerText =
    "Loading " + title + "...";

    setTimeout(()=>{

        document.getElementById(
        "loading"
        ).style.display = "none";

        document.getElementById(
        "gameScreen"
        ).style.display = "flex";

        document.getElementById(
        "frame"
        ).src = file;

        document.getElementById(
        "title"
        ).innerText = title;

        clearInterval(timer);

        timer = setInterval(()=>{

            if(activeGame){

                stats[activeGame].time++;

                updateUI();
            }

        },1000);

    },1200);
}

/* CLOSE */

function closeGame(){

    clearInterval(timer);

    timer = null;

    activeGame = null;

    document.getElementById(
    "gameScreen"
    ).style.display = "none";

    document.getElementById(
    "frame"
    ).src = "";

    updateUI();
}

/* INIT */

updateUI();

</script>

</body>
</html>
