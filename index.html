<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎮 Game Hub</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  color:white;
  background:
  radial-gradient(circle at top,#12204a 0%,#09101f 55%,#050912 100%);
  min-height:100vh;
  overflow:hidden;
}

/* HEADER */
header{
  text-align:center;
  padding:28px 20px 10px;
}

header h1{
  margin:0;
  font-size:52px;
  letter-spacing:1px;
  text-shadow:
  0 0 15px rgba(0,255,255,0.35);
}

header p{
  margin-top:10px;
  color:#9edfff;
  font-size:18px;
}

/* HUB */
.hub{
  display:grid;
  grid-template-columns:repeat(3,220px);
  gap:22px;
  justify-content:center;
  padding:35px;
}

/* CARD */
.card{
  width:220px;
  height:200px;
  border-radius:20px;
  position:relative;
  overflow:hidden;
  cursor:pointer;

  background-size:cover;
  background-position:center;

  border:2px solid rgba(0,255,255,0.25);

  box-shadow:
  0 0 18px rgba(0,255,255,0.12),
  0 10px 25px rgba(0,0,0,0.45);

  transition:
  transform 0.22s,
  box-shadow 0.22s,
  border 0.22s;
}

.card:hover{
  transform:
  translateY(-6px)
  scale(1.04);

  border:2px solid rgba(0,255,255,0.75);

  box-shadow:
  0 0 28px rgba(0,255,255,0.45),
  0 14px 35px rgba(0,0,0,0.55);
}

.overlay{
  position:absolute;
  inset:0;

  background:
  linear-gradient(
  to top,
  rgba(0,0,0,0.82),
  rgba(0,0,0,0.08)
  );
}

.card h2{
  position:absolute;
  left:12px;
  bottom:8px;
  margin:0;
  z-index:2;
  font-size:18px;
}

.stats{
  position:absolute;
  left:12px;
  bottom:34px;
  z-index:2;

  color:#9ffcff;
  font-size:13px;
  font-weight:bold;

  text-shadow:
  0 0 8px rgba(0,255,255,0.45);
}

/* GAME SCREEN */
#gameScreen{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  flex-direction:column;
  z-index:20;
}

#topbar{
  height:58px;

  background:
  linear-gradient(to right,#111,#171717);

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:0 16px;

  border-bottom:
  1px solid rgba(255,255,255,0.08);
}

#title{
  font-size:18px;
  font-weight:bold;
}

button{
  border:none;
  padding:10px 16px;
  border-radius:10px;

  background:#00ffd0;
  color:black;

  font-weight:bold;
  cursor:pointer;

  transition:0.15s;
}

button:hover{
  transform:scale(1.05);
}

iframe{
  width:100%;
  height:100%;
  border:none;
  background:black;
}

/* LOADING */
#loading{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,0.94);

  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  z-index:999;
}

.loader{
  width:75px;
  height:75px;

  border-radius:50%;
  border:6px solid #1e293b;
  border-top:6px solid #00ffd0;

  animation:spin 1s linear infinite;

  box-shadow:
  0 0 25px rgba(0,255,208,0.25);
}

@keyframes spin{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}

#loadingText{
  margin-top:18px;
  color:#00ffd0;
  font-size:18px;
  letter-spacing:1px;
}

/* SMALL GLOW */
.glow{
  position:absolute;
  inset:-40%;

  background:
  radial-gradient(
  circle,
  rgba(0,255,255,0.18),
  transparent 70%
  );

  opacity:0;
  transition:0.25s;
}

.card:hover .glow{
  opacity:1;
}
</style>
</head>

<body>

<header>
  <h1>🎮 GAME HUB</h1>
  <p>Choose your game</p>
</header>

<div class="hub">

  <!-- CHESS -->
  <div class="card"
  style="background-image:url(logochess.png)"
  onclick="openGame('game1.html','Chess','chess')">

    <div class="glow"></div>
    <div class="overlay"></div>

    <div class="stats" id="chessStats"></div>

    <h2>♟ Chess</h2>
  </div>

  <!-- CHECKERS -->
  <div class="card"
  style="background-image:url(logocheckers.png)"
  onclick="openGame('game2.html','Checkers','checkers')">

    <div class="glow"></div>
    <div class="overlay"></div>

    <div class="stats" id="checkersStats"></div>

    <h2>⚫ Checkers</h2>
  </div>

  <!-- CROSS SUMS -->
  <div class="card"
  style="background-image:url(logocrosssum.png)"
  onclick="openGame('game3.html','Cross Sums','cross')">

    <div class="glow"></div>
    <div class="overlay"></div>

    <div class="stats" id="crossStats"></div>

    <h2>🧠 Cross Sums</h2>
  </div>

  <!-- FRUIT -->
  <div class="card"
  style="background-image:url(fruit.png)"
  onclick="openGame('fruit.html','Fruit Clicker','fruit')">

    <div class="glow"></div>
    <div class="overlay"></div>

    <div class="stats" id="fruitStats"></div>

    <h2>🍓 Fruit Clicker</h2>
  </div>

  <!-- UNO -->
  <div class="card"
  style="background-image:url(unologo.png)"
  onclick="openGame('uno.html','UNO Deluxe','uno')">

    <div class="glow"></div>
    <div class="overlay"></div>

    <div class="stats" id="unoStats"></div>

    <h2>🃏 UNO Deluxe</h2>
  </div>

</div>

<!-- LOADING -->
<div id="loading">

  <div class="loader"></div>

  <div id="loadingText">
    Loading game...
  </div>

</div>

<!-- GAME SCREEN -->
<div id="gameScreen">

  <div id="topbar">

    <span id="title">
      Game
    </span>

    <button onclick="closeGame()">
      ⬅ Back
    </button>

  </div>

  <iframe id="frame"></iframe>

</div>

<script>

/* SAFE SAVE SYSTEM */
let stats =
JSON.parse(
localStorage.getItem("gameStats")
) || {};

/* FIX OLD SAVES */
if(!stats.chess){
  stats.chess={time:0};
}

if(!stats.checkers){
  stats.checkers={time:0};
}

if(!stats.cross){
  stats.cross={time:0};
}

if(!stats.fruit){
  stats.fruit={time:0};
}

if(!stats.uno){
  stats.uno={time:0};
}

let timer = null;
let activeKey = null;

/* UPDATE UI */
function updateUI(){

  document.getElementById("chessStats")
  .innerText =
  `⏱ ${stats.chess.time}s`;

  document.getElementById("checkersStats")
  .innerText =
  `⏱ ${stats.checkers.time}s`;

  document.getElementById("crossStats")
  .innerText =
  `⏱ ${stats.cross.time}s`;

  document.getElementById("fruitStats")
  .innerText =
  `⏱ ${stats.fruit.time}s`;

  document.getElementById("unoStats")
  .innerText =
  `⏱ ${stats.uno.time}s`;

  localStorage.setItem(
    "gameStats",
    JSON.stringify(stats)
  );
}

/* OPEN GAME */
function openGame(file,title,key){

  clearInterval(timer);

  activeKey = key;

  document.getElementById("loading")
  .style.display = "flex";

  setTimeout(()=>{

    document.getElementById("loading")
    .style.display = "none";

    document.querySelector(".hub")
    .style.display = "none";

    document.querySelector("header")
    .style.display = "none";

    document.getElementById("gameScreen")
    .style.display = "flex";

    document.getElementById("frame")
    .src = file;

    document.getElementById("title")
    .innerText = title;

    /* SAFE TIMER */
    timer = setInterval(()=>{

      if(
        activeKey &&
        stats[activeKey]
      ){

        stats[activeKey].time++;

        updateUI();
      }

    },1000);

  },850);
}

/* CLOSE GAME */
function closeGame(){

  clearInterval(timer);

  timer = null;
  activeKey = null;

  document.getElementById("gameScreen")
  .style.display = "none";

  document.querySelector(".hub")
  .style.display = "grid";

  document.querySelector("header")
  .style.display = "block";

  document.getElementById("frame")
  .src = "";

  updateUI();
}

/* START */
updateUI();

</script>

</body>
</html>
