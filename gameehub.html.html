<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Hub</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f111a;
  color:white;
  overflow:hidden;
}

header{
  text-align:center;
  padding:20px;
}

header h1{
  margin:0;
  font-size:40px;
}

.hub{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  padding:30px;
}

.card{
  width:220px;
  height:200px;
  border-radius:16px;
  position:relative;
  background-size:cover;
  background-position:center;
  cursor:pointer;
  overflow:hidden;
  transition:0.25s;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:12px;

  border:2px solid rgba(0,255,200,0.6);
  box-shadow:0 0 12px rgba(0,255,200,0.4);
}

.card:hover{
  transform:scale(1.08);
  box-shadow:0 0 25px rgba(0,255,200,0.9);
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
}

.card h2{
  position:relative;
  margin:0;
  font-size:18px;
  z-index:2;
}

.stats{
  position:relative;
  z-index:2;
  font-size:12px;
  margin-top:4px;
  color:#aefcff;
}

/* GAME SCREEN */
#gameScreen{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  flex-direction:column;
}

#topbar{
  background:#111;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#00ffcc;
  font-weight:bold;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* LOADING */
#loading{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.loader{
  width:60px;
  height:60px;
  border:6px solid #333;
  border-top:6px solid #00ffcc;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

/* MUSIC BUTTON */
#musicBtn{
  position:fixed;
  bottom:15px;
  right:15px;
  background:#00ffcc;
  border:none;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h1>🎮 GAME HUB</h1>
  <p>Choose your game</p>
</header>

<div class="hub">

  <div class="card" style="background-image:url(logochess.png)"
    onclick="openGame('game1.html','Chess','chess')">
    <div class="overlay"></div>
    <h2>♟ Chess</h2>
    <div class="stats">⏱ Time mode</div>
  </div>

  <div class="card" style="background-image:url(logocheckers.png)"
    onclick="openGame('game2.html','Checkers','checkers')">
    <div class="overlay"></div>
    <h2>⚫ Checkers</h2>
    <div class="stats">⏱ Time mode</div>
  </div>

  <div class="card" style="background-image:url(logocrosssum.png)"
    onclick="openGame('game3.html','Cross Sums','cross')">
    <div class="overlay"></div>
    <h2>🧠 Cross Sums</h2>
    <div class="stats">⏱ Time mode</div>
  </div>

</div>

<!-- 🎧 AUDIO (SAFE) -->
<audio id="bgMusic" loop preload="auto">
  <source src="elevator.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" onclick="toggleMusic()">🎵 Music</button>

<!-- LOADING -->
<div id="loading">
  <div class="loader"></div>
</div>

<!-- GAME -->
<div id="gameScreen">
  <div id="topbar">
    <span id="title">Game</span>
    <button onclick="closeGame()">⬅ Back</button>
  </div>
  <iframe id="frame"></iframe>
</div>

<script>

let music = document.getElementById("bgMusic");
music.volume = 0.3;

let musicStarted = false;
let timer = null;

/* 🧠 SAFE MUSIC START (FIXED) */
function startMusic(){
  if(musicStarted) return;

  const playPromise = music.play();

  if(playPromise !== undefined){
    playPromise
      .then(()=>{
        musicStarted = true;
      })
      .catch(err=>{
        console.log("Music blocked until user interacts:", err);
      });
  }

  document.removeEventListener("click", startMusic);
}

/* must be user interaction */
document.addEventListener("click", startMusic);

/* OPEN GAME */
function openGame(file,title){

  document.getElementById("loading").style.display="flex";

  setTimeout(()=>{

    document.getElementById("loading").style.display="none";
    document.querySelector(".hub").style.display="none";
    document.querySelector("header").style.display="none";

    document.getElementById("gameScreen").style.display="flex";
    document.getElementById("frame").src=file;
    document.getElementById("title").innerText=title;

  },800);
}

/* CLOSE GAME */
function closeGame(){

  document.getElementById("gameScreen").style.display="none";
  document.querySelector(".hub").style.display="flex";
  document.querySelector("header").style.display="block";

  document.getElementById("frame").src="";
}

/* TOGGLE MUSIC */
function toggleMusic(){
  if(music.paused){
    music.play();
  }else{
    music.pause();
  }
}

</script>

</body>
</html>
